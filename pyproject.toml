[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparmap-st"
version = "1.0"
description = " A Spatially Aware Framework for Gene-Set Activity Mapping"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "anndata",
    "scanpy",
    "scikit-learn",
    "scikit-misc",
    "torch==2.5.1",
    "harmonypy",
    "tqdm",
    "zy_log>=0.3",
]

[project.scripts]
sparmap = "sparmap.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparmap", "sparmap.*"]
