[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparmap-st"
version = "1.0.1"
description = "A Spatially Aware Framework for Gene-Set Activity Mapping"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "anndata",
    "scanpy",
    "scikit-learn",
    "scikit-misc",
    "torch==2.5.1",
    "harmonypy",
    "tqdm",
    "zy_log>=0.3",
]

[project.scripts]
sparmap = "sparmap.runner:main"

[project.urls]
Homepage = "https://github.com/zhoumuci/SpaRMap"
Repository = "https://github.com/zhoumuci/SpaRMap"
Documentation = "https://github.com/zhoumuci/SpaRMap/blob/main/docs/tutorial/tutorial.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparmap", "sparmap.*"]
